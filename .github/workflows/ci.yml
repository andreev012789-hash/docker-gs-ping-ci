name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go build ./...
      - run: go test ./...
      - run: docker build -f Dockerfile.mine -t docker-gs-ping:ci .
      - name: Smoke test
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8090/health && exit 0
            sleep 1
          done
          docker compose logs
          exit 1

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build -f Dockerfile.mine -t ghcr.io/${{ github.repository }}:latest -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
          docker push --all-tags ghcr.io/${{ github.repository }}
