name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go build ./...
      - run: go test ./...
      - run: docker build -f Dockerfile.mine -t docker-gs-ping:ci .
      - name: Smoke test
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8090/health && exit 0
            sleep 1
          done
          docker compose logs
          exit 1
